name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: ${{ github.event.inputs.version }}
          body: "Automated release for PHP versions"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP for Current Version
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Capture Runtime PHP
        run: |
          echo "RUNTIME_PHP=$(command -v php)" >> "$GITHUB_ENV"
          echo "COMPOSER_BIN=$(command -v composer)" >> "$GITHUB_ENV"

      - name: Setup PHP for Box
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Build PHAR
        run: make build PHP_BIN="$RUNTIME_PHP" BOX_PHP="$(command -v php)" COMPOSER_BIN="$COMPOSER_BIN"
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer

      - name: Rename PHAR File
        run: |
          mv client.phar client-${{ matrix.php-version }}.phar

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: ./client-${{ matrix.php-version }}.phar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
